services:
  dsm:
    image: povtoffen/virtual-dsm
    container_name: dsm
    environment:
      DISK_SIZE: "16G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 5000:5000
    volumes:
      - ./dsm:/storage
    restart: on-failure
    stop_grace_period: 2m
